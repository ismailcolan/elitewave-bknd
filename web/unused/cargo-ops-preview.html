<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargo Ops Dashboard — Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>

  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "recharts": "https://esm.sh/recharts@2.15.2?deps=react@18.3.1,react-dom@18.3.1",

    #root { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
    .preview-banner {

<body>
  <div id="root">
    <p class="preview-banner">Loading Cargo Ops Dashboard preview…</p>
  </div>
  <script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import {
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
  ResponsiveContainer, Cell, PieChart, Pie,
} from 'recharts';
import {
  Package, FileText, Wallet, Receipt, Truck, CheckCircle2, Clock,
  ArrowLeft, ChevronRight, TrendingUp, TrendingDown,
} from 'lucide-react';

const COLOR = {
  ink: '#1B2430',
  paper: '#F5F6F3',
  steel: '#4B6A87',
  steelMid: '#93A9B8',
  steelTint: '#E7ECEE',
  signal: '#C9941F',
  signalTint: '#F7ECD2',
  route: '#2F6F5E',
  routeTint: '#E1EEEA',
  alert: '#A8453A',
  alertTint: '#F3E3E0',
  line: '#E3E1D8',
  muted: '#6B7480',
};

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const EXPENSE_CATS = ['Fuel', 'Tolls & permits', 'Driver allowance', 'Maintenance', 'Miscellaneous'];
const CUSTOMERS = ['Aarav Traders', 'BlueWave Exports', 'Continental Foods', 'Deccan Textiles', 'Everest Pharma', 'Falcon Auto Parts', 'Ganga Chemicals', 'Horizon Electronics', 'Indus Steel Co.', 'Jaya Agro Ltd.', 'Kaveri Textiles', 'Lotus Freight Buyers'];
const ROUTES = [
  ['Mumbai', 'Delhi'], ['Chennai', 'Bengaluru'], ['Kolkata', 'Hyderabad'], ['Pune', 'Ahmedabad'],
  ['Delhi', 'Jaipur'], ['Mumbai', 'Dubai'], ['Chennai', 'Colombo'], ['Nhava Sheva', 'Nagpur'],
  ['Bengaluru', 'Kochi'], ['Ludhiana', 'Mumbai'], ['Surat', 'Indore'], ['Hyderabad', 'Vizag'],
];

const TAB_CONFIGS = {
  consignments: { label: 'Consignments booked', icon: Package, color: COLOR.steel, currency: false },
  invoices: { label: 'Invoice generation', icon: FileText, color: COLOR.steel, currency: true },
  payments: { label: 'Payment collection', icon: Wallet, color: COLOR.route, currency: true },
  expenses: { label: 'Expenses', icon: Receipt, color: COLOR.alert, currency: true },
  delivery: { label: 'Delivery status', icon: Truck, color: COLOR.route, currency: false },
};

const STATUS_COLOR = {
  Delivered: COLOR.route,
  'In transit': COLOR.steel,
  'Pending pickup': COLOR.signal,
  Delayed: COLOR.alert,
};

function pad(n) { return String(n).padStart(2, '0'); }
function daysIn(y, m) { return new Date(y, m + 1, 0).getDate(); }

function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function aggDays(days, idx, name) {
  const sum = (key) => days.reduce((a, x) => a + x[key], 0);
  const expenseBreakdown = EXPENSE_CATS.reduce((acc, cat) => {
    acc[cat] = days.reduce((a, x) => a + x.expenseBreakdown[cat], 0);
    return acc;
  }, {});
  return {
    idx, name, days,
    consignments: sum('consignments'),
    invoiceCount: sum('invoiceCount'),
    invoiceAmount: sum('invoiceAmount'),
    paymentCount: sum('paymentCount'),
    paymentAmount: sum('paymentAmount'),
    expenseAmount: sum('expenseAmount'),
    expenseBreakdown,
    delivered: sum('delivered'),
    delayed: sum('delayed'),
    inTransit: sum('inTransit'),
    pending: sum('pending'),
  };
}

function genYear(year, seed, monthCap, dayCap) {
  const rng = mulberry32(seed);
  const numMonths = monthCap != null ? monthCap + 1 : 12;
  const months = [];
  for (let m = 0; m < numMonths; m++) {
    const totalDays = daysIn(year, m);
    const isLast = m === numMonths - 1;
    const dLimit = isLast && dayCap ? dayCap : totalDays;
    const seasonal = 1 + 0.12 * Math.sin((m / 12) * Math.PI * 2 - 1);
    const growth = 1 + m * 0.008;
    const days = [];
    for (let d = 1; d <= dLimit; d++) {
      const dt = new Date(year, m, d);
      const dow = dt.getDay();
      const wf = dow === 0 ? 0.3 : dow === 6 ? 0.55 : 1;
      const noise = 0.82 + rng() * 0.36;
      const consignments = Math.max(0, Math.round(30 * seasonal * growth * wf * noise));
      const avgValue = 8200 + rng() * 3400;
      const invoiceCount = Math.round(consignments * (0.88 + rng() * 0.14));
      const invoiceAmount = Math.round(invoiceCount * avgValue);
      const collRatio = 0.72 + rng() * 0.22;
      const paymentAmount = Math.round(invoiceAmount * collRatio);
      const paymentCount = Math.round(invoiceCount * (0.65 + rng() * 0.28));
      const expBase = consignments * (1650 + rng() * 650);
      const fPct = 0.44 + rng() * 0.04;
      const tPct = 0.14 + rng() * 0.03;
      const drPct = 0.23 + rng() * 0.03;
      const mPct = 0.10 + rng() * 0.03;
      const miscPct = Math.max(0.02, 1 - (fPct + tPct + drPct + mPct));
      const expenseBreakdown = {
        Fuel: expBase * fPct,
        'Tolls & permits': expBase * tPct,
        'Driver allowance': expBase * drPct,
        Maintenance: expBase * mPct,
        Miscellaneous: expBase * miscPct,
      };
      const expenseAmount = Object.values(expenseBreakdown).reduce((a, b) => a + b, 0);
      const delivered = Math.round(consignments * (0.74 + rng() * 0.16));
      const delayed = Math.round(consignments * (0.02 + rng() * 0.045));
      const inTransit = Math.round(consignments * (0.10 + rng() * 0.08));
      const pending = Math.max(0, consignments - delivered - delayed - inTransit);
      days.push({
        d, dow, iso: `${year}-${pad(m + 1)}-${pad(d)}`,
        consignments, invoiceCount, invoiceAmount, paymentCount, paymentAmount,
        expenseAmount, expenseBreakdown, delivered, delayed, inTransit, pending,
      });
    }
    months.push(aggDays(days, m, MONTHS[m]));
  }
  return { year, months };
}

function sliceYear(yearObj, monthCap, dayCap) {
  return yearObj.months.slice(0, monthCap + 1).map((mo, i) => {
    if (i === monthCap && dayCap != null) {
      const days = mo.days.filter((x) => x.d <= dayCap);
      return aggDays(days, mo.idx, mo.name);
    }
    return mo;
  });
}

function sumMonths(months) {
  const sum = (key) => months.reduce((a, mo) => a + mo[key], 0);
  const expenseBreakdown = EXPENSE_CATS.reduce((acc, cat) => {
    acc[cat] = months.reduce((a, mo) => a + mo.expenseBreakdown[cat], 0);
    return acc;
  }, {});
  return {
    consignments: sum('consignments'),
    invoiceCount: sum('invoiceCount'),
    invoiceAmount: sum('invoiceAmount'),
    paymentCount: sum('paymentCount'),
    paymentAmount: sum('paymentAmount'),
    expenseAmount: sum('expenseAmount'),
    expenseBreakdown,
    delivered: sum('delivered'),
    delayed: sum('delayed'),
    inTransit: sum('inTransit'),
    pending: sum('pending'),
  };
}

function genRecent(seed) {
  const rng = mulberry32(seed);
  const rows = [];
  const n = 10;
  const today = new Date(2026, 8, 14);
  for (let i = 0; i < n; i++) {
    const daysAgo = Math.floor(rng() * 18);
    const dt = new Date(today);
    dt.setDate(dt.getDate() - daysAgo);
    const iso = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
    const route = ROUTES[Math.floor(rng() * ROUTES.length)];
    const statusRoll = rng();
    let status;
    if (daysAgo <= 1) status = rng() < 0.5 ? 'In transit' : 'Pending pickup';
    else if (statusRoll < 0.68) status = 'Delivered';
    else if (statusRoll < 0.85) status = 'In transit';
    else if (statusRoll < 0.94) status = 'Pending pickup';
    else status = 'Delayed';
    rows.push({
      id: `CN-2026${String(3100 + Math.floor(rng() * 899) + i * 7).padStart(4, '0')}`,
      customer: CUSTOMERS[Math.floor(rng() * CUSTOMERS.length)],
      origin: route[0],
      destination: route[1],
      date: iso,
      status,
      amount: Math.round(7800 + rng() * 46000),
    });
  }
  return rows.sort((a, b) => b.date.localeCompare(a.date));
}

function formatINR(v) {
  const n = Math.round(v);
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1e7) return `${sign}₹${(abs / 1e7).toFixed(2)} Cr`;
  if (abs >= 1e5) return `${sign}₹${(abs / 1e5).toFixed(2)} L`;
  return `${sign}₹${abs.toLocaleString('en-IN')}`;
}
function formatAxisINR(v) {
  const abs = Math.abs(v);
  if (abs >= 1e7) return `${(v / 1e7).toFixed(1)}Cr`;
  if (abs >= 1e5) return `${(v / 1e5).toFixed(1)}L`;
  if (abs >= 1e3) return `${(v / 1e3).toFixed(0)}k`;
  return `${Math.round(v)}`;
}
function formatAxisCount(v) { return Math.round(v).toLocaleString('en-IN'); }
function formatShortDate(iso) {
  const d = new Date(`${iso}T00:00:00`);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
function lighten(hex, amt) {
  const clean = hex.replace('#', '');
  const num = parseInt(clean, 16);
  let r = (num >> 16) & 255;
  let g = (num >> 8) & 255;
  let b = num & 255;
  r = Math.round(r + (255 - r) * amt);
  g = Math.round(g + (255 - g) * amt);
  b = Math.round(b + (255 - b) * amt);
  return `rgb(${r}, ${g}, ${b})`;
}

function buildMonthSeries(tabKey, months) {
  return months.map((mo) => {
    const base = { label: mo.name, idx: mo.idx };
    switch (tabKey) {
      case 'consignments': return { ...base, value: mo.consignments };
      case 'invoices': return { ...base, value: mo.invoiceAmount, count: mo.invoiceCount };
      case 'payments': return { ...base, invoiced: mo.invoiceAmount, collected: mo.paymentAmount, value: mo.paymentAmount };
      case 'expenses': return { ...base, value: mo.expenseAmount };
      case 'delivery': return { ...base, value: mo.delivered, delayed: mo.delayed };
      default: return { ...base, value: 0 };
    }
  });
}

function buildDaySeries(tabKey, month) {
  return month.days.map((d) => {
    const base = { label: String(d.d), dayNum: d.d, dow: d.dow };
    switch (tabKey) {
      case 'consignments': return { ...base, value: d.consignments };
      case 'invoices': return { ...base, value: d.invoiceAmount, count: d.invoiceCount };
      case 'payments': return { ...base, invoiced: d.invoiceAmount, collected: d.paymentAmount, value: d.paymentAmount };
      case 'expenses': return { ...base, value: d.expenseAmount };
      case 'delivery': return { ...base, value: d.delivered, delayed: d.delayed };
      default: return { ...base, value: 0 };
    }
  });
}

function computeStats(rows) {
  if (!rows.length) return { total: 0, avg: 0, best: null };
  const total = rows.reduce((a, r) => a + r.value, 0);
  const avg = total / rows.length;
  const best = rows.reduce((b, r) => (r.value > b.value ? r : b), rows[0]);
  return { total, avg, best };
}

function dayFill(base, entry, today) {
  if (today) return COLOR.signal;
  if (entry.dow === 0 || entry.dow === 6) return lighten(base, 0.55);
  return base;
}

function DeltaTag({ value, suffix, good }) {
  const Icon = value >= 0 ? TrendingUp : TrendingDown;
  const color = good ? COLOR.route : COLOR.alert;
  const sign = value >= 0 ? '+' : '-';
  return (
    <span className="kpi-delta" style={{ color }}>
      <Icon size={12} />
      {sign}{Math.abs(value).toFixed(1)}{suffix} YoY
    </span>
  );
}

function kpiValueDisplay(k) {
  if (k.kind === 'currency') return formatINR(k.value);
  if (k.kind === 'pct') return `${k.value.toFixed(1)}%`;
  return Math.round(k.value).toLocaleString('en-IN');
}

function renderDelta(k) {
  if (k.prev == null) {
    return <span className="kpi-delta muted">First year on record</span>;
  }
  let diff;
  let suffix;
  if (k.kind === 'pct') {
    diff = k.value - k.prev;
    suffix = ' pt';
  } else {
    diff = k.prev === 0 ? (k.value === 0 ? 0 : 100) : ((k.value - k.prev) / k.prev) * 100;
    suffix = '%';
  }
  const good = k.good === 'up' ? diff >= 0 : diff <= 0;
  return <DeltaTag value={diff} suffix={suffix} good={good} />;
}

function StatusTag({ status }) {
  const c = STATUS_COLOR[status] || COLOR.muted;
  return (
    <span className="status-tag">
      <span className="status-dot" style={{ background: c }} />
      <span style={{ color: c }}>{status}</span>
    </span>
  );
}

function ChartTooltip({ active, payload, label, currency, isDual, tabKey }) {
  if (!active || !payload || !payload.length) return null;
  if (tabKey === 'delivery') {
    const row = payload[0].payload;
    return (
      <div className="chart-tooltip">
        <div className="tt-label">{label}</div>
        <div className="tt-row"><span>Delivered</span><span className="mono">{row.value}</span></div>
        <div className="tt-row"><span>Delayed</span><span className="mono">{row.delayed}</span></div>
      </div>
    );
  }
  if (tabKey === 'invoices') {
    const row = payload[0].payload;
    return (
      <div className="chart-tooltip">
        <div className="tt-label">{label}</div>
        <div className="tt-row"><span>Amount</span><span className="mono">{formatINR(row.value)}</span></div>
        <div className="tt-row"><span>Invoices</span><span className="mono">{row.count}</span></div>
      </div>
    );
  }
  if (isDual) {
    return (
      <div className="chart-tooltip">
        <div className="tt-label">{label}</div>
        {payload.map((p) => (
          <div key={p.dataKey} className="tt-row">
            <span>{p.name}</span>
            <span className="mono">{formatINR(p.value)}</span>
          </div>
        ))}
      </div>
    );
  }
  return (
    <div className="chart-tooltip">
      <div className="tt-label">{label}</div>
      <div className="tt-row">
        <span className="mono">{currency ? formatINR(payload[0].value) : Math.round(payload[0].value).toLocaleString('en-IN')}</span>
      </div>
    </div>
  );
}

function DonutTooltip({ active, payload, total }) {
  if (!active || !payload || !payload.length) return null;
  const p = payload[0];
  return (
    <div className="chart-tooltip">
      <div className="tt-row">
        <span style={{ color: p.payload.color }}>{p.name}</span>
        <span className="mono">{p.value} ({Math.round((p.value / total) * 100)}%)</span>
      </div>
    </div>
  );
}

function ExpenseBreakdown({ breakdown }) {
  const entries = Object.entries(breakdown).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((a, [, v]) => a + v, 0) || 1;
  return (
    <div className="mini-panel">
      <div className="mini-panel-title">Where the expense went</div>
      {entries.map(([cat, amt]) => (
        <div key={cat} className="mini-row">
          <span className="mini-label">{cat}</span>
          <div className="mini-track"><div className="mini-fill" style={{ width: `${(amt / total) * 100}%` }} /></div>
          <span className="mini-amt mono">{formatINR(amt)}</span>
        </div>
      ))}
    </div>
  );
}

function DeliveryExtras({ scope, recent }) {
  const donutData = [
    { name: 'Delivered', value: scope.delivered, color: COLOR.route },
    { name: 'In transit', value: scope.inTransit, color: COLOR.steel },
    { name: 'Pending pickup', value: scope.pending, color: COLOR.signal },
    { name: 'Delayed', value: scope.delayed, color: COLOR.alert },
  ].filter((d) => d.value > 0);
  const total = donutData.reduce((a, d) => a + d.value, 0) || 1;

  return (
    <div className="delivery-extras">
      <div>
        <div className="mini-panel-title">Status mix, current scope</div>
        <div className="donut-wrap">
          <ResponsiveContainer width="100%" height={190}>
            <PieChart>
              <Pie data={donutData} dataKey="value" nameKey="name" innerRadius={54} outerRadius={78} paddingAngle={2} stroke="none">
                {donutData.map((d, i) => <Cell key={i} fill={d.color} />)}
              </Pie>
              <Tooltip content={<DonutTooltip total={total} />} />
            </PieChart>
          </ResponsiveContainer>
          <div className="donut-center">
            <div className="donut-total mono">{total.toLocaleString('en-IN')}</div>
            <div className="donut-total-label">consignments</div>
          </div>
        </div>
        <div className="donut-legend">
          {donutData.map((d) => (
            <span key={d.name} className="legend-item">
              <span className="legend-dot" style={{ background: d.color }} />
              {d.name} <b className="mono">{Math.round((d.value / total) * 100)}%</b>
            </span>
          ))}
        </div>
      </div>

      <div>
        <div className="mini-panel-title">Recent consignments</div>
        <div className="table-scroll">
          <table className="ledger-table">
            <thead>
              <tr><th>ID</th><th>Customer</th><th>Route</th><th>Booked</th><th>Status</th><th className="num">Amount</th></tr>
            </thead>
            <tbody>
              {recent.map((r) => (
                <tr key={r.id}>
                  <td className="mono">{r.id}</td>
                  <td>{r.customer}</td>
                  <td>{r.origin} → {r.destination}</td>
                  <td className="mono">{formatShortDate(r.date)}</td>
                  <td><StatusTag status={r.status} /></td>
                  <td className="mono num">{formatINR(r.amount)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function MetricPanel({ tabKey, tabColor, currency, yearData, year, drillMonth, setDrillMonth, recent }) {
  const monthLevel = drillMonth === null;
  const rows = monthLevel ? buildMonthSeries(tabKey, yearData.months) : buildDaySeries(tabKey, yearData.months[drillMonth]);
  const scope = monthLevel ? sumMonths(yearData.months) : yearData.months[drillMonth];
  const stats = computeStats(rows);
  const isDual = tabKey === 'payments';
  const partialMonthIdx = year === 2026 ? yearData.months.length - 1 : -1;
  const isToday = (r) => year === 2026 && drillMonth === partialMonthIdx && r.dayNum === 14;

  const fmt = (v) => (currency ? formatINR(v) : Math.round(v).toLocaleString('en-IN'));
  const axisFmt = (v) => (currency ? formatAxisINR(v) : formatAxisCount(v));

  return (
    <div>
      <div className="flex items-center justify-between flex-wrap gap-2 mb-3">
        <div className="flex items-center gap-2">
          {!monthLevel && (
            <button className="back-btn" onClick={() => setDrillMonth(null)}>
              <ArrowLeft size={13} /> Back to months
            </button>
          )}
          <span className="breadcrumb">
            {year}
            {!monthLevel && (
              <>
                {' '}<ChevronRight size={11} style={{ display: 'inline', verticalAlign: '-1px' }} />{' '}
                {yearData.months[drillMonth].name}
              </>
            )}
          </span>
        </div>
        {monthLevel ? (
          <span className="hint">Click a bar for the daily breakdown</span>
        ) : (
          <span className="hint">
            Weekends shown lighter{year === 2026 && drillMonth === partialMonthIdx ? ' · gold marks today' : ''}
          </span>
        )}
      </div>

      <ResponsiveContainer width="100%" height={300}>
        <BarChart data={rows} margin={{ top: 6, right: 8, left: 0, bottom: 0 }} barCategoryGap={monthLevel ? '30%' : '20%'} barGap={4}>
          <CartesianGrid stroke="#EDECE5" vertical={false} />
          <XAxis dataKey="label" tick={{ fontSize: 11, fill: COLOR.muted }} axisLine={{ stroke: '#DEDDD5' }} tickLine={false} />
          <YAxis tick={{ fontSize: 11, fill: COLOR.muted }} tickFormatter={axisFmt} axisLine={false} tickLine={false} width={52} />
          <Tooltip content={<ChartTooltip currency={currency} isDual={isDual} tabKey={tabKey} />} cursor={{ fill: 'rgba(75,106,135,0.08)' }} />
          {isDual && <Legend wrapperStyle={{ fontSize: 12 }} />}
          {isDual ? (
            <>
              <Bar
                dataKey="invoiced" name="Invoiced" fill={COLOR.steelMid}
                radius={monthLevel ? [3, 3, 0, 0] : [2, 2, 0, 0]}
                onClick={monthLevel ? (_, i) => setDrillMonth(i) : undefined}
                cursor={monthLevel ? 'pointer' : 'default'}
              >
                {!monthLevel && rows.map((r, i) => <Cell key={i} fill={dayFill(COLOR.steelMid, r, isToday(r))} />)}
              </Bar>
              <Bar
                dataKey="collected" name="Collected" fill={COLOR.route}
                radius={monthLevel ? [3, 3, 0, 0] : [2, 2, 0, 0]}
                onClick={monthLevel ? (_, i) => setDrillMonth(i) : undefined}
                cursor={monthLevel ? 'pointer' : 'default'}
              >
                {!monthLevel && rows.map((r, i) => <Cell key={i} fill={dayFill(COLOR.route, r, isToday(r))} />)}
              </Bar>
            </>
          ) : (
            <Bar
              dataKey="value" fill={tabColor}
              radius={monthLevel ? [3, 3, 0, 0] : [2, 2, 0, 0]}
              onClick={monthLevel ? (_, i) => setDrillMonth(i) : undefined}
              cursor={monthLevel ? 'pointer' : 'default'}
            >
              {!monthLevel && rows.map((r, i) => <Cell key={i} fill={dayFill(tabColor, r, isToday(r))} />)}
            </Bar>
          )}
        </BarChart>
      </ResponsiveContainer>

      <div className="stats-strip">
        <span>Total <b className="mono">{fmt(stats.total)}</b></span>
        <span>{monthLevel ? 'Avg / month' : 'Avg / day'} <b className="mono">{fmt(stats.avg)}</b></span>
        {stats.best && (
          <span>
            Best {monthLevel ? 'month' : 'day'}{' '}
            <b className="mono">
              {monthLevel ? stats.best.label : `${yearData.months[drillMonth].name} ${stats.best.label}`} · {fmt(stats.best.value)}
            </b>
          </span>
        )}
        {tabKey === 'payments' && (
          <span>Outstanding <b className="mono">{formatINR(scope.invoiceAmount - scope.paymentAmount)}</b></span>
        )}
        {tabKey === 'invoices' && (
          <span>Invoices <b className="mono">{scope.invoiceCount.toLocaleString('en-IN')}</b></span>
        )}
      </div>

      {year === 2026 && (
        <p className="footnote">September 2026 is still in progress — its figures run through 14 Sep.</p>
      )}

      {tabKey === 'expenses' && <ExpenseBreakdown breakdown={scope.expenseBreakdown} />}
      {tabKey === 'delivery' && <DeliveryExtras scope={scope} recent={recent} />}
    </div>
  );
}

function CargoLogisticsDashboard() {
  const data = useMemo(() => ({
    2024: genYear(2024, 24680, null, null),
    2025: genYear(2025, 25791, null, null),
    2026: genYear(2026, 26802, 8, 14),
  }), []);
  const recent = useMemo(() => genRecent(90210), []);

  const [year, setYear] = useState(2026);
  const [tab, setTab] = useState('consignments');
  const [drillMonth, setDrillMonth] = useState(null);

  const yearData = data[year];
  const monthCap = yearData.months.length - 1;
  const lastMonthFullDays = daysIn(year, monthCap);
  const lastMonthActual = yearData.months[monthCap].days.length;
  const dayCap = lastMonthActual < lastMonthFullDays ? lastMonthActual : null;

  const cur = sumMonths(yearData.months);
  const priorYearData = data[year - 1] || null;
  const priorMonths = priorYearData ? sliceYear(priorYearData, monthCap, dayCap) : null;
  const prev = priorMonths ? sumMonths(priorMonths) : null;

  function selectYear(y) { setYear(y); setDrillMonth(null); }
  function selectTab(t) { setTab(t); setDrillMonth(null); }

  const kpiDefs = [
    { key: 'consignments', tab: 'consignments', label: 'Consignments booked', icon: Package, value: cur.consignments, prev: prev ? prev.consignments : null, kind: 'count', good: 'up' },
    { key: 'invoiced', tab: 'invoices', label: 'Invoice value', icon: FileText, value: cur.invoiceAmount, prev: prev ? prev.invoiceAmount : null, kind: 'currency', good: 'up' },
    { key: 'collected', tab: 'payments', label: 'Payments collected', icon: Wallet, value: cur.paymentAmount, prev: prev ? prev.paymentAmount : null, kind: 'currency', good: 'up' },
    { key: 'outstanding', tab: 'payments', label: 'Outstanding', icon: Clock, value: cur.invoiceAmount - cur.paymentAmount, prev: prev ? (prev.invoiceAmount - prev.paymentAmount) : null, kind: 'currency', good: 'down' },
    { key: 'expenses', tab: 'expenses', label: 'Total expenses', icon: Receipt, value: cur.expenseAmount, prev: prev ? prev.expenseAmount : null, kind: 'currency', good: 'down' },
    { key: 'ontime', tab: 'delivery', label: 'On-time delivery', icon: CheckCircle2, value: (cur.delivered / ((cur.delivered + cur.delayed) || 1)) * 100, prev: prev ? (prev.delivered / ((prev.delivered + prev.delayed) || 1)) * 100 : null, kind: 'pct', good: 'up' },
  ];

  const activeConfig = TAB_CONFIGS[tab];

  return (
    <div className="cld-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

        .cld-root {
          --ink: #1B2430; --paper: #F5F6F3; --steel: #4B6A87; --steel-mid: #93A9B8;
          --steel-tint: #E7ECEE; --signal: #C9941F; --signal-tint: #F7ECD2;
          --route: #2F6F5E; --route-tint: #E1EEEA; --alert: #A8453A; --alert-tint: #F3E3E0;
          --line: #E3E1D8; --muted: #6B7480;
          font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
          background: var(--paper); color: var(--ink);
          border-radius: 12px; overflow: hidden; border: 1px solid var(--line); max-width: 100%;
        }
        .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }

        .cld-header { background: var(--ink); color: var(--paper); padding: 18px 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .cld-title { font-size: 19px; font-weight: 600; letter-spacing: 0.01em; }
        .cld-subtitle { font-size: 12.5px; color: #AEB9C2; margin-top: 5px; max-width: 42ch; line-height: 1.45; }
        .cld-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }
        .cld-date { font-size: 12px; color: #AEB9C2; }
        .year-toggle { display: flex; border: 1px solid #3A4756; border-radius: 6px; overflow: hidden; }
        .year-btn { padding: 6px 13px; font-size: 12.5px; background: transparent; color: #CBD3D9; border: none; cursor: pointer; font-family: inherit; }
        .year-btn + .year-btn { border-left: 1px solid #3A4756; }
        .year-btn.active { background: var(--signal); color: var(--ink); font-weight: 600; }

        .kpi-row { display: flex; flex-wrap: wrap; background: #fff; }
        .kpi-cell { flex: 1 1 155px; padding: 13px 16px; border-top: 3px solid transparent; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; background: transparent; cursor: pointer; font-family: inherit; }
        .kpi-cell:hover { background: var(--steel-tint); }
        .kpi-cell.active { border-top-color: var(--signal); background: var(--steel-tint); }
        .kpi-label { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
        .kpi-value { font-size: 19px; font-weight: 600; color: var(--ink); }
        .kpi-delta { font-size: 11px; margin-top: 5px; display: flex; align-items: center; gap: 3px; }
        .kpi-delta.muted { color: var(--muted); }

        .tab-row { display: flex; gap: 0; padding: 0 18px; border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap; }
        .tab-btn { display: flex; align-items: center; gap: 6px; padding: 12px 4px; margin-right: 22px; font-size: 13px; color: var(--muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit; }
        .tab-btn:hover { color: var(--ink); }
        .tab-btn.active { color: var(--ink); border-bottom-color: var(--signal); font-weight: 600; }

        .cld-panel { padding: 20px; background: #fff; }
        .breadcrumb { font-size: 12.5px; color: var(--muted); }
        .hint { font-size: 11.5px; color: var(--muted); }
        .back-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--steel); background: var(--steel-tint); border: none; padding: 5px 11px; border-radius: 5px; cursor: pointer; font-family: inherit; }
        .back-btn:hover { background: #D8E1E7; }

        .stats-strip { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
        .stats-strip b { color: var(--ink); font-weight: 600; margin-left: 4px; }

        .footnote { font-size: 11.5px; color: var(--muted); margin-top: 10px; }

        .chart-tooltip { background: var(--ink); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.2); min-width: 120px; }
        .tt-label { font-weight: 600; margin-bottom: 5px; font-family: 'IBM Plex Mono', monospace; }
        .tt-row { display: flex; justify-content: space-between; gap: 16px; }
        .tt-row + .tt-row { margin-top: 2px; }

        .mini-panel { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
        .mini-panel-title { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 11px; }
        .mini-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12.5px; }
        .mini-label { width: 150px; flex-shrink: 0; color: var(--muted); }
        .mini-track { flex: 1; height: 7px; background: var(--steel-tint); border-radius: 3px; overflow: hidden; }
        .mini-fill { height: 100%; background: var(--alert); border-radius: 3px; }
        .mini-amt { width: 92px; text-align: right; flex-shrink: 0; }

        .delivery-extras { display: grid; grid-template-columns: 1fr; gap: 24px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
        .donut-wrap { position: relative; }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
        .donut-total { font-size: 21px; font-weight: 700; }
        .donut-total-label { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
        .donut-legend { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 12px; font-size: 12px; }
        .legend-item { display: flex; align-items: center; gap: 5px; color: var(--muted); }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

        .table-scroll { overflow-x: auto; }
        .ledger-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
        .ledger-table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
        .ledger-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
        .status-tag { display: inline-flex; align-items: center; gap: 6px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .num { text-align: right; }

        .cld-footer { padding: 12px 20px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); background: #fff; }

        @media (min-width: 860px) {
          .delivery-extras { grid-template-columns: 300px 1fr; }
        }
      `}</style>

      <div className="cld-header">
        <div>
          <div className="cld-title">Cargo Ops Dashboard</div>
          <div className="cld-subtitle">Bookings, billing, collections and delivery performance in one view.</div>
        </div>
        <div className="cld-header-right">
          <div className="cld-date mono">Data through 14 Sep 2026</div>
          <div className="year-toggle">
            {[2024, 2025, 2026].map((y) => (
              <button key={y} className={`year-btn${year === y ? ' active' : ''}`} onClick={() => selectYear(y)}>{y}</button>
            ))}
          </div>
        </div>
      </div>

      <div className="kpi-row">
        {kpiDefs.map((k) => {
          const Icon = k.icon;
          return (
            <button key={k.key} className={`kpi-cell${tab === k.tab ? ' active' : ''}`} onClick={() => selectTab(k.tab)}>
              <div className="kpi-label"><Icon size={13} /> {k.label}</div>
              <div className="kpi-value mono">{kpiValueDisplay(k)}</div>
              {renderDelta(k)}
            </button>
          );
        })}
      </div>

      <div className="tab-row">
        {Object.entries(TAB_CONFIGS).map(([key, cfg]) => {
          const Icon = cfg.icon;
          return (
            <button key={key} className={`tab-btn${tab === key ? ' active' : ''}`} onClick={() => selectTab(key)}>
              <Icon size={14} /> {cfg.label}
            </button>
          );
        })}
      </div>

      <div className="cld-panel">
        <MetricPanel
          tabKey={tab}
          tabColor={activeConfig.color}
          currency={activeConfig.currency}
          yearData={yearData}
          year={year}
          drillMonth={drillMonth}
          setDrillMonth={setDrillMonth}
          recent={recent}
        />
      </div>

      <div className="cld-footer">
        Figures shown are illustrative sample data generated for this preview. Connect it to your booking, billing and dispatch systems to power it with live numbers.
      </div>
    </div>
  );
}

createRoot(document.getElementById('root')).render(<CargoLogisticsDashboard />);
  </script>
</body>
</html>
